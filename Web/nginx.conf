server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API runs as its own container named "api" (see Backend/docker-compose.yml).
  location /api/  { proxy_pass http://api:8000; proxy_set_header Host $host; client_max_body_size 20m; }
  location /Image/ { proxy_pass http://api:8000; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
