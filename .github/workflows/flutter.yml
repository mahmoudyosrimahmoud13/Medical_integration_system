name: Flutter app

on:
  push:
    branches: ["**"]   # every branch push runs the checks for the folders it changed
    tags: ["v*"]       # a version tag (git tag v2.0.1) runs every check, whatever changed
    paths: ["Flutter/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["Flutter/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the build"
        default: "https://api.healthhub.example.com"

defaults:
  run:
    working-directory: Flutter/healthhub

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Apply the standard Dart formatting instead of failing on it. Run ./run.sh format locally to keep it tidy.
      - run: dart format lib test tool
      # Real errors fail the build; style hints are only reported.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: Flutter/healthhub/coverage/lcov.info

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders and apply the HealthHub identity
        run: |
          flutter create . --project-name healthhub --org com.healthhub --platforms=android,ios,web   # the icon tool also writes iOS and web icons
          dart run tool/patch_platforms.dart
          flutter pub get
          dart run flutter_launcher_icons
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://api.healthhub.example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-android-apk
          path: Flutter/healthhub/build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create . --project-name healthhub --org com.healthhub --platforms=android,ios,web   # the icon tool also writes Android and iOS icons
          dart run tool/patch_platforms.dart
          flutter pub get
          dart run flutter_launcher_icons
      - run: flutter build web --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || vars.API_BASE_URL || 'https://api.healthhub.example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-web
          path: Flutter/healthhub/build/web

  # A version tag (git tag v2.0.1 && git push origin v2.0.1) publishes a GitHub Release
  # with the Android app and the Flutter web build attached.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: healthhub-android-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: healthhub-web
          path: release/web
      - name: Name the files after the version
        run: |
          cd release
          mv app-release.apk "HealthHub-${{ github.ref_name }}.apk"
          (cd web && zip -qr "../HealthHub-web-${{ github.ref_name }}.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          name: HealthHub ${{ github.ref_name }}
          files: |
            release/HealthHub-${{ github.ref_name }}.apk
            release/HealthHub-web-${{ github.ref_name }}.zip
          generate_release_notes: true
