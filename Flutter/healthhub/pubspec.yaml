name: healthhub
description: "HealthHub: book doctors, keep your medical record, find pharmacies and hospitals."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  intl: any # the version Flutter's own localizations need
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/

# App icon, generated by: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#1B1F3B"
  adaptive_icon_foreground: "assets/logo/app_icon.png"
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
    background_color: "#1B1F3B"
    theme_color: "#1B1F3B"
  windows:
    generate: true
    image_path: "assets/logo/app_icon.png"
