# Runs the whole HealthHub stack: database, API, drug interaction service and web app.
#   docker compose up --build      then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthhub
      POSTGRES_PASSWORD: healthhub
      POSTGRES_DB: healthhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthhub"]
      interval: 3s
      retries: 20

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://healthhub:healthhub@db:5432/healthhub
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      SEED_ARGS: ${SEED_ARGS:---demo}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ai:8001}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

  ai:
    build:
      context: ./AI
      args:
        WITH_MODEL: ${WITH_MODEL:-0}   # WITH_MODEL=1 adds the MVN-DDI model (PyTorch, big image)
    ports:
      - "8001:8001"

  web:
    build: ./Web
    depends_on:
      - api
    ports:
      - "8080:80"

  # Cloudflare Tunnel, no server needed:
  #   docker compose --profile tunnel up --build          free temporary address, see: docker compose logs tunnel
  #   TUNNEL_TOKEN=... docker compose --profile tunnel-named up --build   your own address
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on: [web]

  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-named"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]

volumes:
  pgdata:
  media:
