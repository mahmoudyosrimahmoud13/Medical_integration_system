name: Backend (FastAPI)

on:
  push:
    branches: ["**"]   # every branch push runs the checks for the folders it changed
    tags: ["v*"]       # a version tag (git tag v2.0.1) runs every check, whatever changed
    paths: ["Backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["Backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests --select F,E9
      - run: pytest -q
      - name: Migrations run on a fresh database
        run: alembic upgrade head && python -m app.seed --demo

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t healthhub-api Backend
