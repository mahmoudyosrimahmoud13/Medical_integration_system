name: Flutter app

on:
  push:
    paths: ["Flutter/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["Flutter/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL baked into the build"
        default: "https://api.healthhub.example.com"

defaults:
  run:
    working-directory: Flutter/healthhub

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: Flutter/healthhub/coverage/lcov.info

  android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders and apply the HealthHub identity
        run: |
          flutter create . --project-name healthhub --org com.healthhub --platforms=android
          dart run tool/patch_platforms.dart
          flutter pub get
          dart run flutter_launcher_icons
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api.healthhub.example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-android-apk
          path: Flutter/healthhub/build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Build web
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create . --project-name healthhub --org com.healthhub --platforms=web
          dart run tool/patch_platforms.dart
          flutter pub get
          dart run flutter_launcher_icons
      - run: flutter build web --release --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://api.healthhub.example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: healthhub-web
          path: Flutter/healthhub/build/web
